<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math Trail</title>
<meta name="description" content="A small math game for children. Every answer is tracked anonymously and feeds a data pipeline.">
<style>
  :root {
    --bg: #f6f4ef;
    --card: #ffffff;
    --ink: #1f2430;
    --muted: #6b7280;
    --accent: #2f6fdf;
    --accent-ink: #ffffff;
    --good: #1f9d55;
    --bad: #d64545;
    --line: #e5e1d8;
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15181f;
      --card: #1e232d;
      --ink: #eef0f4;
      --muted: #9aa3b2;
      --accent: #5b8ff0;
      --line: #2c3340;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  h1 { font-size: 1.5rem; margin: 0; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
  }
  .hidden { display: none !important; }
  label.group-label { display: block; font-weight: 600; margin: 0 0 8px; }
  .choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin-bottom: 16px; }
  .choice {
    border: 2px solid var(--line); background: transparent; color: var(--ink);
    border-radius: 12px; padding: 12px 8px; font: inherit; font-weight: 600; cursor: pointer;
  }
  .choice[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .btn {
    display: inline-block; border: 0; border-radius: 12px; padding: 14px 20px;
    font: inherit; font-weight: 700; cursor: pointer; background: var(--accent); color: var(--accent-ink);
  }
  .btn.secondary { background: transparent; color: var(--ink); border: 2px solid var(--line); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .lang { display: flex; gap: 4px; }
  .lang .choice { padding: 6px 10px; }
  .privacy { color: var(--muted); font-size: .875rem; margin: 0; }
  .progress { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin-bottom: 16px; }
  .progress > div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .meta { display: flex; justify-content: space-between; color: var(--muted); font-size: .875rem; margin-bottom: 8px; }
  .question { font-size: clamp(2rem, 9vw, 3.5rem); font-weight: 800; text-align: center; margin: 12px 0 20px; font-variant-numeric: tabular-nums; }
  form.answer { display: flex; gap: 8px; }
  form.answer input {
    flex: 1; min-width: 0; font: inherit; font-size: 1.75rem; font-weight: 700; text-align: center;
    padding: 10px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); color: var(--ink);
  }
  form.answer input:focus { outline: none; border-color: var(--accent); }
  .row { display: flex; gap: 8px; justify-content: space-between; margin-top: 12px; }
  .feedback { min-height: 1.75rem; text-align: center; font-weight: 700; margin-top: 12px; }
  .feedback.good { color: var(--good); }
  .feedback.bad { color: var(--bad); }
  .score { font-size: 3rem; font-weight: 800; text-align: center; margin: 8px 0; }
  details { color: var(--muted); font-size: .875rem; }
  details summary { cursor: pointer; font-weight: 600; }
  pre { white-space: pre-wrap; word-break: break-word; background: var(--bg); padding: 12px; border-radius: 8px; max-height: 260px; overflow: auto; font-size: .75rem; }
  .status { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <header>
    <h1 data-t="title">Math Trail</h1>
    <div class="lang" role="group" aria-label="Language">
      <button class="choice" data-lang="en" aria-pressed="true">EN</button>
      <button class="choice" data-lang="da" aria-pressed="false">DA</button>
    </div>
  </header>

  <!-- Start screen -->
  <section id="start" class="card">
    <label class="group-label" data-t="pickTopic">Pick a topic</label>
    <div class="choices" id="topics"></div>
    <label class="group-label" data-t="pickLevel">Pick a level</label>
    <div class="choices" id="levels"></div>
    <button class="btn" id="startBtn" data-t="start">Start</button>
    <p class="privacy" style="margin-top:16px" data-t="privacy"></p>
  </section>

  <!-- Play screen -->
  <section id="play" class="card hidden">
    <div class="meta"><span id="qCounter"></span><span id="scoreLive"></span></div>
    <div class="progress"><div id="bar"></div></div>
    <div class="question" id="question" aria-live="polite"></div>
    <form class="answer" id="answerForm" autocomplete="off">
      <input id="answer" inputmode="numeric" pattern="[0-9]*" maxlength="10" aria-label="Answer">
      <button class="btn" id="submitBtn" type="submit" data-t="check">Check</button>
    </form>
    <div class="feedback" id="feedback" role="status"></div>
    <div class="row">
      <button class="btn secondary" id="skipBtn" type="button" data-t="skip">Skip</button>
      <button class="btn secondary" id="quitBtn" type="button" data-t="quit">Stop</button>
    </div>
  </section>

  <!-- End screen -->
  <section id="end" class="card hidden">
    <p style="text-align:center;margin:0" data-t="youGot">You got</p>
    <div class="score" id="finalScore"></div>
    <div class="row">
      <button class="btn" id="againBtn" data-t="again">Play again</button>
      <button class="btn secondary" id="menuBtn" data-t="menu">Change topic</button>
    </div>
  </section>

  <!-- Behind the scenes: shows the events sent to the pipeline -->
  <details class="card">
    <summary><span data-t="behind">Behind the scenes</span> · <span class="status" id="sendStatus"></span></summary>
    <p data-t="behindText"></p>
    <pre id="eventLog">[]</pre>
  </details>
</main>

<script>
"use strict";

// ---- Config -------------------------------------------------------------
// The publishable key is public by design. The database only lets it insert
// into bronze.answer_events (see supabase/migrations/0001_bronze_answer_events.sql).
const SUPABASE_URL = "https://fmyqoyzpafqthksfpdcn.supabase.co";
const SUPABASE_KEY = "sb_publishable_i_KekwRxlYVB6hkJO9vliA_13_YCvK2";
const QUESTIONS_PER_ROUND = 10;

// ---- Text ---------------------------------------------------------------
const TEXT = {
  en: {
    title: "Math Trail",
    pickTopic: "Pick a topic", pickLevel: "Pick a level", start: "Start",
    privacy: "We save your answers without your name, so we can see which sums are tricky. Nothing is saved about who you are.",
    check: "Check", skip: "Skip", quit: "Stop",
    youGot: "You got", again: "Play again", menu: "Change topic",
    question: "Question", correct: "Correct!", wrongWas: "Not quite. The answer is",
    skipped: "Skipped. The answer is",
    behind: "Behind the scenes",
    behindText: "Each answer is sent as an event to a database. A nightly pipeline turns the events into a dashboard. These are the events from this visit:",
    sent: "sent", failed: "failed",
    topics: { addition: "Plus", subtraction: "Minus", multiplication: "Times", division: "Divide" },
    levels: { 1: "Easy", 2: "Medium", 3: "Hard" }
  },
  da: {
    title: "Regnestien",
    pickTopic: "Vælg regningsart", pickLevel: "Vælg niveau", start: "Start",
    privacy: "Vi gemmer dine svar uden dit navn, så vi kan se, hvilke opgaver der er svære. Vi gemmer intet om, hvem du er.",
    check: "Tjek", skip: "Spring over", quit: "Stop",
    youGot: "Du fik", again: "Spil igen", menu: "Skift regningsart",
    question: "Opgave", correct: "Rigtigt!", wrongWas: "Ikke helt. Svaret er",
    skipped: "Sprunget over. Svaret er",
    behind: "Bag kulisserne",
    behindText: "Hvert svar sendes som en hændelse til en database. En natlig pipeline gør hændelserne til et dashboard. Her er hændelserne fra dette besøg:",
    sent: "sendt", failed: "fejlet",
    topics: { addition: "Plus", subtraction: "Minus", multiplication: "Gange", division: "Division" },
    levels: { 1: "Let", 2: "Mellem", 3: "Svær" }
  }
};

const TOPICS = ["addition", "subtraction", "multiplication", "division"];
const SYMBOL = { addition: "+", subtraction: "−", multiplication: "×", division: "÷" };
// Difficulty per level, aimed at ages 8–12.
// Addition/subtraction: numbers within this limit.
const RANGE = { 1: 100, 2: 500, 3: 1000 };
// Multiplication: [min, max] for each factor.
const FACTORS = {
  1: [[2, 10], [1, 10]],    // times tables
  2: [[11, 20], [2, 9]],    // 2-digit × 1-digit
  3: [[11, 30], [11, 20]]   // 2-digit × 2-digit
};
// Division: [min, max] for divisor and quotient. Answers are always whole.
const DIVISION = {
  1: [[2, 10], [1, 10]],    // inverse times tables
  2: [[2, 9], [11, 25]],    // 2- and 3-digit ÷ 1-digit
  3: [[11, 20], [2, 20]]    // ÷ 2-digit
};

// ---- State --------------------------------------------------------------
const state = {
  lang: "en", topic: "addition", level: 1,
  sessionId: null, index: 0, score: 0, current: null, shownAt: 0, locked: false, timer: null,
  log: [], sent: 0, failed: 0
};

// ---- Helpers ------------------------------------------------------------
const $ = (id) => document.getElementById(id);
const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const t = () => TEXT[state.lang];

function uuid() {
  if (crypto.randomUUID) return crypto.randomUUID();
  // Fallback for older browsers.
  return "10000000-1000-4000-8000-100000000000".replace(/[018]/g, (c) =>
    (c ^ (crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (c / 4)))).toString(16));
}

// ---- Question generation ------------------------------------------------
// Returns { a, b, answer }. All values are whole numbers >= 0.
function makeQuestion(topic, level) {
  if (topic === "addition") {
    const max = RANGE[level];
    const a = rand(Math.floor(max / 10), max - 1);
    const b = rand(1, max - a);
    return { a, b, answer: a + b };
  }
  if (topic === "subtraction") {
    const max = RANGE[level];
    const a = rand(Math.floor(max / 10), max);
    const b = rand(1, a);
    return { a, b, answer: a - b };
  }
  if (topic === "multiplication") {
    const [fa, fb] = FACTORS[level];
    const a = rand(fa[0], fa[1]);
    const b = rand(fb[0], fb[1]);
    return Math.random() < 0.5 ? { a, b, answer: a * b } : { a: b, b: a, answer: a * b };
  }
  // division: built backwards from divisor × quotient, so the answer is whole
  const [fd, fq] = DIVISION[level];
  const divisor = rand(fd[0], fd[1]);
  const quotient = rand(fq[0], fq[1]);
  return { a: divisor * quotient, b: divisor, answer: quotient };
}

// ---- Event tracking -----------------------------------------------------
// One event per answer or skip. Sending never blocks the game.
function track(givenAnswer, responseMs) {
  const q = state.current;
  const event = {
    session_id: state.sessionId,
    language: state.lang,
    topic: state.topic,
    level: state.level,
    question_index: state.index,
    operand_a: q.a,
    operand_b: q.b,
    correct_answer: q.answer,
    given_answer: givenAnswer,
    response_ms: Math.min(Math.round(responseMs), 600000),
    client_ts: new Date().toISOString()
  };
  state.log.push(event);
  renderLog();
  send(event, 2);
}

async function send(event, retriesLeft) {
  try {
    const res = await fetch(SUPABASE_URL + "/rest/v1/answer_events", {
      method: "POST",
      keepalive: true,
      headers: {
        "apikey": SUPABASE_KEY,
        "Content-Type": "application/json",
        "Content-Profile": "bronze",   // target the bronze schema
        "Prefer": "return=minimal"     // anon has no select right
      },
      body: JSON.stringify(event)
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    state.sent++;
  } catch (err) {
    if (retriesLeft > 0) {
      setTimeout(() => send(event, retriesLeft - 1), 1500);
      return;
    }
    state.failed++;
    console.warn("Event not sent:", err);
  }
  renderStatus();
}

// ---- Rendering ----------------------------------------------------------
function applyText() {
  document.documentElement.lang = state.lang;
  document.title = t().title;
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t()[el.dataset.t]; });
  document.querySelectorAll("[data-lang]").forEach((b) =>
    b.setAttribute("aria-pressed", String(b.dataset.lang === state.lang)));
  renderChoices();
  renderStatus();
  if (state.current) renderMeta();
}

function renderChoices() {
  $("topics").innerHTML = "";
  TOPICS.forEach((topic) => {
    const b = document.createElement("button");
    b.className = "choice";
    b.textContent = SYMBOL[topic] + " " + t().topics[topic];
    b.setAttribute("aria-pressed", String(topic === state.topic));
    b.onclick = () => { state.topic = topic; renderChoices(); };
    $("topics").appendChild(b);
  });
  $("levels").innerHTML = "";
  [1, 2, 3].forEach((level) => {
    const b = document.createElement("button");
    b.className = "choice";
    b.textContent = t().levels[level];
    b.setAttribute("aria-pressed", String(level === state.level));
    b.onclick = () => { state.level = level; renderChoices(); };
    $("levels").appendChild(b);
  });
}

function renderMeta() {
  $("qCounter").textContent = t().question + " " + state.index + "/" + QUESTIONS_PER_ROUND;
  $("scoreLive").textContent = "★ " + state.score;
  $("bar").style.width = ((state.index - 1) / QUESTIONS_PER_ROUND * 100) + "%";
}

function renderStatus() {
  $("sendStatus").textContent = state.sent + " " + t().sent + (state.failed ? ", " + state.failed + " " + t().failed : "");
}

function renderLog() {
  $("eventLog").textContent = JSON.stringify(state.log.slice(-5).reverse(), null, 2);
}

function show(id) {
  ["start", "play", "end"].forEach((s) => $(s).classList.toggle("hidden", s !== id));
}

// ---- Game flow ----------------------------------------------------------
function startRound() {
  clearTimeout(state.timer);
  state.sessionId = uuid();
  state.index = 0;
  state.score = 0;
  show("play");
  nextQuestion();
}

function nextQuestion() {
  if (state.index >= QUESTIONS_PER_ROUND) return endRound();
  state.index++;
  state.current = makeQuestion(state.topic, state.level);
  state.locked = false;
  const q = state.current;
  $("question").textContent = q.a + " " + SYMBOL[state.topic] + " " + q.b + " = ?";
  $("answer").value = "";
  $("feedback").textContent = "";
  $("feedback").className = "feedback";
  $("submitBtn").disabled = true;
  renderMeta();
  $("answer").focus();
  state.shownAt = performance.now();
}

function answer(raw) {
  if (state.locked) return;
  state.locked = true;
  const elapsed = performance.now() - state.shownAt;
  const given = raw === null ? null : raw.trim().slice(0, 10);
  track(given, elapsed);

  const fb = $("feedback");
  if (given !== null && Number(given) === state.current.answer && /^\d+$/.test(given)) {
    state.score++;
    fb.textContent = t().correct;
    fb.className = "feedback good";
  } else {
    fb.textContent = (given === null ? t().skipped : t().wrongWas) + " " + state.current.answer;
    fb.className = "feedback bad";
  }
  renderMeta();
  state.timer = setTimeout(nextQuestion, given !== null && Number(given) === state.current.answer ? 700 : 1600);
}

function endRound() {
  state.current = null;
  $("bar").style.width = "100%";
  $("finalScore").textContent = state.score + " / " + QUESTIONS_PER_ROUND;
  show("end");
}

// ---- Wiring -------------------------------------------------------------
$("answerForm").addEventListener("submit", (e) => {
  e.preventDefault();
  if ($("answer").value.trim() !== "") answer($("answer").value);
});
$("answer").addEventListener("input", (e) => {
  e.target.value = e.target.value.replace(/[^0-9]/g, "");
  $("submitBtn").disabled = e.target.value === "";
});
$("skipBtn").onclick = () => answer(null);
// Stopping sends nothing: the last question_index in a session shows where the player gave up.
$("quitBtn").onclick = () => { clearTimeout(state.timer); state.current = null; show("start"); };
$("againBtn").onclick = startRound;
$("menuBtn").onclick = () => show("start");
$("startBtn").onclick = startRound;
document.querySelectorAll("[data-lang]").forEach((b) =>
  b.addEventListener("click", () => { state.lang = b.dataset.lang; applyText(); }));

state.lang = (navigator.language || "en").toLowerCase().startsWith("da") ? "da" : "en";
applyText();
</script>
</body>
</html>
