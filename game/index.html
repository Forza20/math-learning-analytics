<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Regnestien</title>
<meta name="description" content="A math obstacle course for children. Every answer is tracked anonymously and feeds a data pipeline.">
<!-- Installable app (PWA) -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4db8ff">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Math Trail">
<style>
  /* Bright, blocky "sunny town" look: chunky outlines, flat colours, big buttons.
     The game keeps one daytime theme, also when the device is in dark mode. */
  :root {
    color-scheme: light;
    --sky-top: #4db8ff;
    --sky-bottom: #c9ecff;
    --card: #ffffff;
    --ink: #23272f;
    --muted: #5d6470;
    --accent: #2fbf4f;
    --accent-dark: #1f8a37;
    --accent-ink: #ffffff;
    --good: #1f9d55;
    --bad: #e23b3b;
    --line: #23272f;
    --soft: #eef3f8;
    --radius: 14px;
    --font: ui-rounded, "Arial Rounded MT Bold", "Nunito", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    background: linear-gradient(var(--sky-top), var(--sky-bottom)) fixed;
    color: var(--ink);
    font: 16px/1.4 var(--font);
  }
  main { max-width: 560px; margin: 0 auto; padding: max(12px, env(safe-area-inset-top)) 12px 32px; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  h1 {
    font-size: 1.75rem; margin: 0; color: #fff; letter-spacing: .5px;
    text-shadow: 0 3px 0 var(--line), 2px 0 0 var(--line), -2px 0 0 var(--line), 0 -2px 0 var(--line);
  }
  .card {
    background: var(--card);
    border: 3px solid var(--line);
    border-radius: var(--radius);
    box-shadow: 0 5px 0 var(--line);
    padding: 16px;
    margin-bottom: 16px;
  }
  .hidden { display: none !important; }
  label.group-label { display: block; font-weight: 800; margin: 0 0 8px; }
  .rules { margin: 0 0 14px; font-weight: 700; }
  .choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin-bottom: 16px; }
  .choice {
    border: 3px solid var(--line); background: #fff; color: var(--ink);
    border-radius: 12px; padding: 12px 8px; font: inherit; font-weight: 800; cursor: pointer;
    box-shadow: 0 3px 0 var(--line);
  }
  .choice[aria-pressed="true"] { background: #ffd84d; }
  .btn {
    display: inline-block; border: 3px solid var(--line); border-radius: 12px; padding: 12px 22px;
    font: inherit; font-size: 1.125rem; font-weight: 800; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); box-shadow: 0 4px 0 var(--accent-dark), 0 4px 0 3px var(--line);
    text-shadow: 0 2px 0 rgba(0,0,0,.25);
  }
  .btn:active, .choice:active, .key:active { transform: translateY(3px); box-shadow: none; }
  .btn.secondary { background: #fff; color: var(--ink); box-shadow: 0 4px 0 var(--line); text-shadow: none; }
  .btn.small { padding: 6px 12px; font-size: .95rem; box-shadow: 0 3px 0 var(--line); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .privacy { color: var(--muted); font-size: .875rem; margin: 0; }
  .best { font-weight: 800; margin: 0 0 14px; }
  .row { display: flex; gap: 8px; justify-content: space-between; margin-top: 12px; flex-wrap: wrap; }

  /* ---- Play screen ---------------------------------------------------- */
  .hud { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .pill {
    background: #fff; border: 3px solid var(--line); border-radius: 99px; padding: 4px 12px;
    font-weight: 800; font-variant-numeric: tabular-nums; box-shadow: 0 3px 0 var(--line); white-space: nowrap;
  }
  .clock { flex: 1; text-align: center; font-size: 1.25rem; position: relative; }
  .penalty-pop {
    position: absolute; left: 50%; top: 100%; transform: translateX(-50%); z-index: 10;
    color: var(--bad); font-weight: 900; font-size: 1.25rem; pointer-events: none;
    text-shadow: 0 2px 0 #fff; animation: pop 1.2s ease-out forwards;
  }
  @keyframes pop { 0% { opacity: 0; transform: translate(-50%, -10px) scale(.6); } 20% { opacity: 1; transform: translate(-50%, 8px) scale(1.4); } 100% { opacity: 0; transform: translate(-50%, 30px) scale(1); } }

  .scene {
    position: relative; height: 170px; overflow: hidden;
    border: 3px solid var(--line); border-radius: var(--radius); box-shadow: 0 5px 0 var(--line);
    background: linear-gradient(#5ec2ff, #bfe8ff 70%);
    margin-bottom: 12px;
  }
  .cloud { position: absolute; background: #fff; border-radius: 6px; opacity: .95; }
  .cloud::before, .cloud::after { content: ""; position: absolute; background: #fff; border-radius: 6px; }
  .cloud::before { width: 55%; height: 140%; left: 15%; bottom: 40%; }
  .cloud::after { width: 35%; height: 110%; left: 55%; bottom: 30%; }
  .layer { position: absolute; left: 0; bottom: 0; height: 100%; will-change: transform; transition-property: transform; transition-timing-function: linear; }
  #town svg { position: absolute; left: 0; bottom: 50px; }
  #world {
    /* road and sidewalk move with the world */
    background:
      linear-gradient(to top, transparent 22px, #ffd84d 22px, #ffd84d 25px, transparent 25px) 0 0 / 48px 100% repeat-x,
      linear-gradient(to top, #5b6270 0, #5b6270 44px, #23272f 44px, #23272f 47px, #cfd6de 47px, #cfd6de 56px, #7ccf4f 56px, #7ccf4f 60px, transparent 60px);
  }
  #world::after { /* gaps in the dashed centre line */
    content: ""; position: absolute; left: 0; right: 0; bottom: 21px; height: 5px;
    background: repeating-linear-gradient(to right, transparent 0 28px, #5b6270 28px 48px);
  }
  .obstacle { position: absolute; bottom: 8px; z-index: 2; }
  .obstacle.hit { animation: shake .4s; }
  @keyframes shake { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-8deg); } 75% { transform: rotate(6deg); } }
  .marker { position: absolute; bottom: 8px; z-index: 1; }
  .flag-text { font: 900 13px var(--font); fill: #23272f; }

  /* Blocky runner */
  #avatar { position: absolute; left: 0; bottom: 10px; width: 0; z-index: 3; will-change: transform; transition-property: transform; transition-timing-function: linear; }
  .sprite { position: absolute; left: -18px; bottom: 0; width: 36px; height: 66px; transform-origin: 50% 100%; }
  .sprite > div { position: absolute; border: 2px solid var(--line); }
  .head { left: 7px; top: 0; width: 22px; height: 21px; background: #ffcf9e; border-radius: 4px; z-index: 2; }
  .head::before, .head::after { content: ""; position: absolute; top: 7px; width: 3px; height: 4px; background: var(--line); }
  .head::before { left: 5px; } .head::after { right: 5px; }
  .hair { left: 5px; top: -3px; width: 26px; height: 9px; background: #6b3f1f; border-radius: 4px 4px 1px 1px; z-index: 3; }
  .mouth { left: 14px; top: 14px; width: 8px; height: 3px; border-width: 0 0 2px 0 !important; border-radius: 0 0 4px 4px; z-index: 3; }
  .torso { left: 6px; top: 20px; width: 24px; height: 24px; background: #ff5a5f; border-radius: 2px; z-index: 1; }
  .arm { top: 21px; width: 8px; height: 21px; background: #ffcf9e; border-radius: 2px; transform-origin: 50% 3px; }
  .arm.l { left: -1px; } .arm.r { right: -1px; }
  .leg { top: 42px; width: 11px; height: 24px; background: #2f5fbf; border-radius: 2px; transform-origin: 50% 2px; }
  .leg.l { left: 7px; } .leg.r { left: 18px; }
  .sprite.running .leg.l, .sprite.running .arm.r { animation: swing .32s infinite alternate ease-in-out; }
  .sprite.running .leg.r, .sprite.running .arm.l { animation: swing .32s infinite alternate-reverse ease-in-out; }
  @keyframes swing { from { transform: rotate(32deg); } to { transform: rotate(-32deg); } }
  .sprite.jump { animation: jump var(--jump-ms, .65s) ease-in-out; }
  @keyframes jump { 0%, 12% { transform: translateY(0); } 47% { transform: translateY(-58px) rotate(-8deg); } 85%, 100% { transform: translateY(0); } }
  .sprite.crash { animation: crash .8s ease-in-out; }
  @keyframes crash { 0% { transform: rotate(0); } 25%, 70% { transform: translate(-6px, 4px) rotate(-82deg); } 100% { transform: rotate(0); } }
  .banner {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 5;
    font-size: 3.5rem; font-weight: 900; color: #fff; pointer-events: none;
    text-shadow: 0 4px 0 var(--line), 3px 0 0 var(--line), -3px 0 0 var(--line), 0 -3px 0 var(--line);
  }
  .banner.show { animation: bannerPop .6s ease-out; }
  @keyframes bannerPop { from { transform: scale(1.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .quiz { padding: 12px 16px; margin-bottom: 12px; }
  .qline {
    display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;
    font-size: clamp(1.75rem, 8vw, 2.5rem); font-weight: 900; font-variant-numeric: tabular-nums; min-height: 3.2rem;
  }
  .answer-box {
    min-width: 3.2em; padding: 0 10px; border: 3px solid var(--line); border-radius: 10px; background: var(--soft);
    text-align: center; line-height: 1.3;
  }
  .answer-box.empty { color: #a8b0bb; }
  #question.small { font-size: clamp(1.25rem, 6vw, 1.75rem); }
  /* Mixed puzzles: extra lines above the question, or a grid of fruit to count */
  .prompt { text-align: center; font-weight: 900; font-size: clamp(1.25rem, 6vw, 1.6rem); line-height: 1.35; margin-bottom: 4px; font-variant-numeric: tabular-nums; }
  .prompt .hint { font-size: 1rem; color: var(--muted); }
  .fruit-grid {
    display: inline-grid; gap: 2px; font-size: 15px; line-height: 1; padding: 6px;
    border: 3px solid var(--line); border-radius: 10px; background: #fff7d6;
  }
  @media (max-height: 740px) {
    .scene { height: 120px; }
    .key { min-height: 46px; }
    .quiz { padding: 8px 12px; }
  }
  .feedback { min-height: 1.6rem; text-align: center; font-weight: 800; margin-top: 6px; }
  .feedback.good { color: var(--good); }
  .feedback.bad { color: var(--bad); }

  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .key {
    min-height: 52px; border: 3px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink);
    font: 900 1.5rem var(--font); cursor: pointer; box-shadow: 0 4px 0 var(--line); touch-action: manipulation;
  }
  .key.del { background: #ffd84d; }
  .key.ok { background: var(--accent); color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
  .key:disabled { opacity: .45; cursor: not-allowed; }
  /* Dansk: three spellings to choose from, one under the other */
  .keypad.options { grid-template-columns: 1fr; }
  .keypad.options .key { min-height: 58px; font-size: clamp(1.25rem, 6vw, 1.6rem); letter-spacing: .03em; }
  .keypad.options .key.right { background: var(--good); color: #fff; opacity: 1; }
  .keypad.options .key.wrong { background: var(--bad); color: #fff; opacity: 1; }

  /* ---- End screen ----------------------------------------------------- */
  .dino { display: block; width: min(220px, 60vw); height: auto; margin: 0 auto; }
  .dino .bob { animation: dinoBob 1.6s ease-in-out infinite; transform-origin: 110px 200px; }
  @keyframes dinoBob { 50% { transform: translateY(-5px) rotate(-1.5deg); } }
  .score { font-size: 3rem; font-weight: 900; text-align: center; margin: 4px 0; font-variant-numeric: tabular-nums; }
  .breakdown { text-align: center; font-weight: 700; color: var(--muted); margin: 0; font-variant-numeric: tabular-nums; }
  .record { text-align: center; font-weight: 900; margin: 8px 0 0; color: var(--accent-dark); }

  details { color: var(--muted); font-size: .875rem; }
  details a { color: #2f6fdf; font-weight: 700; }
  details summary { cursor: pointer; font-weight: 800; }
  pre { white-space: pre-wrap; word-break: break-word; background: var(--soft); padding: 12px; border-radius: 8px; max-height: 260px; overflow: auto; font-size: .75rem; }
  .status { font-variant-numeric: tabular-nums; }

  @media (prefers-reduced-motion: reduce) {
    .sprite.running .leg, .sprite.running .arm, .banner.show, .obstacle.hit, .dino .bob { animation: none !important; }
  }
</style>
</head>
<body>
<main>
  <header id="topbar">
    <h1 data-t="title">Regnestien</h1>
  </header>

  <!-- Start screen -->
  <section id="start" class="card">
    <p class="rules" data-t="rules"></p>
    <label class="group-label" data-t="pickTopic">Pick a topic</label>
    <div class="choices" id="topics"></div>
    <label class="group-label" data-t="pickLevel">Pick a level</label>
    <div class="choices" id="levels"></div>
    <p class="best" id="bestStart"></p>
    <button class="btn" id="startBtn" data-t="start">Start</button>
    <button class="btn secondary hidden" id="installBtn" type="button" data-t="install" style="margin-left:8px">Install app</button>
    <p class="privacy hidden" style="margin-top:12px" id="iosHint" data-t="iosHint"></p>
    <p class="privacy" style="margin-top:16px" data-t="privacy"></p>
  </section>

  <!-- Play screen: the obstacle course -->
  <section id="play" class="hidden">
    <div class="hud">
      <button class="btn secondary small" id="quitBtn" type="button" aria-label="Stop">✕</button>
      <span class="pill" id="qCounter"></span>
      <span class="pill clock" id="clock" aria-label="Time">0:00.0</span>
      <button class="btn secondary small" id="muteBtn" type="button" aria-label="Sound">🔊</button>
      <button class="btn secondary small" id="skipBtn" type="button" aria-label="Skip">⏭</button>
    </div>
    <div class="scene" id="scene" aria-hidden="true">
      <div class="cloud" style="left:8%;top:22px;width:60px;height:16px"></div>
      <div class="cloud" style="left:58%;top:12px;width:80px;height:18px"></div>
      <div class="cloud" style="left:84%;top:40px;width:46px;height:12px"></div>
      <div class="layer" id="town"></div>
      <div class="layer" id="world">
        <div id="course"></div>
        <div id="avatar">
          <div class="sprite" id="sprite">
            <div class="arm l"></div><div class="arm r"></div>
            <div class="leg l"></div><div class="leg r"></div>
            <div class="torso"></div>
            <div class="head"></div><div class="hair"></div><div class="mouth"></div>
          </div>
        </div>
      </div>
      <div class="banner" id="banner"></div>
    </div>
    <div class="card quiz">
      <div aria-live="polite">
        <div class="prompt hidden" id="prompt"></div>
        <div class="qline">
          <span id="question"></span>
          <span class="answer-box empty" id="answerBox">?</span>
          <span id="suffix"></span>
        </div>
      </div>
      <div class="feedback" id="feedback" role="status"></div>
    </div>
    <!-- Filled by buildKeypad(): digits for Matematik, letters for Dansk -->
    <div class="keypad" id="keypad"></div>
  </section>

  <!-- End screen -->
  <section id="end" class="card hidden">
    <div id="dino"></div>
    <p style="text-align:center;margin:0;font-weight:800" data-t="yourTime">Your time</p>
    <div class="score" id="finalTime"></div>
    <p class="breakdown" id="breakdown"></p>
    <p class="record" id="record"></p>
    <div class="row" style="justify-content:center">
      <button class="btn" id="againBtn" data-t="again">Play again</button>
      <button class="btn secondary" id="menuBtn" data-t="menu">Change topic</button>
    </div>
  </section>

  <!-- Behind the scenes: shows the events sent to the pipeline -->
  <details class="card" id="behindCard">
    <summary><span data-t="behind">Behind the scenes</span> · <span class="status" id="sendStatus"></span></summary>
    <p data-t="behindText"></p>
    <pre id="eventLog">[]</pre>
    <p><a href="dashboard/" data-t="dashLink">See the dashboard</a></p>
  </details>
</main>

<script src="sound.js"></script>
<script>
"use strict";

// ---- Config -------------------------------------------------------------
// The publishable key is public by design. The database only lets it insert
// into bronze.answer_events (see supabase/migrations/0001_bronze_answer_events.sql).
const SUPABASE_URL = "https://fmyqoyzpafqthksfpdcn.supabase.co";
const SUPABASE_KEY = "sb_publishable_i_KekwRxlYVB6hkJO9vliA_13_YCvK2";
const QUESTIONS_PER_ROUND = 10;      // one obstacle per question
const PENALTY_MS = 10000;            // each wrong or skipped answer adds 10 seconds

// ---- Text ---------------------------------------------------------------
// The game is in Danish only (2026-11-22). Events still carry language "da".
const TEXT = {
  da: {

};

// Two subjects on the start screen. A Matematik round mixes all math topics;
// each answer is still logged with its own topic, so bronze and dbt are unchanged.
const SUBJECTS = ["math", "danish"];
const SUBJECT_ICON = { math: "🔢", danish: "✏️" };
const SYMBOL = { addition: "+", subtraction: "−", multiplication: "×", division: "÷" };

// Dansk: spelling for mellemtrin (ages 8–12). Each entry is [correct, wrong, wrong]:
// words children often misspell (silent h/d/g, hv-/hj-, double consonants, -ig/-lig)
// and two typical misspellings that are not Danish words. Mirrored in simulator/questions.py.
const WORDS = {
  1: [["hvad", "vad", "hvat"], ["hvor", "hvår", "hvorr"], ["hvem", "vem", "hvæm"], ["hvid", "hvit", "hviid"],

  2: [["først", "førsd", "førs"], ["sidst", "sist", "sitst"], ["morgen", "morn", "moren"], ["aften", "aftn", "avten"],
      ["sommer", "somer", "sommar"], ["vinter", "vintter", "vindter"], ["tirsdag", "tisdag", "tirsdaw"],
      ["onsdag", "onsda", "ondsdag"], ["lørdag", "lørda", "lørrdag"], ["sammen", "samen", "sammén"],
      ["hjerte", "jerte", "hjærte"], ["dejlig", "dejli", "dajlig"], ["venner", "vener", "vænner"],
      ["mærkelig", "mærkeli", "merkelig"], ["rigtig", "rigti", "rikti"], ["ligesom", "lisom", "ligsom"],
      ["bjerg", "bjærg", "bjerr"], ["nøgle", "nøjle", "nøgel"], ["spørge", "spørre", "spøre"], ["cykel", "cykkel", "sykel"]],
  3: [["selvfølgelig", "selfølgelig", "selvfølgli"], ["desværre", "desvære", "disværre"], ["egentlig", "egenlig", "ejentlig"],
      ["overraskelse", "overaskelse", "overraskelsse"], ["interessant", "interresant", "intressant"],
      ["efterhånden", "efterhånen", "efterhonden"], ["hurtigt", "hurtit", "hurtikt"], ["nødvendig", "nøvendig", "nødvenig"],
      ["tilfældigvis", "tilfældivis", "tilfeldigvis"], ["fødselsdag", "fødselsda", "føselsdag"],
      ["chokolade", "sjokolade", "chokoladde"], ["giraf", "giraff", "schiraf"], ["restaurant", "restaurang", "restorant"],
      ["ambulance", "ambulanse", "ampulance"], ["bibliotek", "bibiotek", "bibliotæk"], ["tørklæde", "tørklede", "tørkæde"],
      ["køleskab", "køleskap", "kølleskab"], ["hovedpine", "hovepine", "hoveddpine"], ["pludselig", "plutselig", "pludseli"],
      ["spændende", "spænende", "spendende"]]
};
// Difficulty per level, aimed at ages 8–12.
// Addition/subtraction: numbers within this limit.
const RANGE = { 1: 100, 2: 500, 3: 1000 };
// Multiplication: [min, max] for each factor.
const FACTORS = {
  1: [[2, 10], [1, 10]],    // times tables
  2: [[11, 20], [2, 9]],    // 2-digit × 1-digit
  3: [[11, 30], [11, 20]]   // 2-digit × 2-digit
};
// Division: [min, max] for divisor and quotient. Answers are always whole.
const DIVISION = {
  1: [[2, 10], [1, 10]],    // inverse times tables
  2: [[2, 9], [11, 25]],    // 2- and 3-digit ÷ 1-digit
  3: [[11, 20], [2, 20]]    // ÷ 2-digit
};

// ---- State --------------------------------------------------------------
const state = {
  lang: "da", subject: "math", level: 1,
  sessionId: null, index: 0, score: 0, current: null, shownAt: 0, locked: true,
  typed: "", runMs: 0, penalties: 0, x: 0, run: 0, queue: [],
  log: [], sent: 0, failed: 0
};

// ---- Helpers ------------------------------------------------------------
const $ = (id) => document.getElementById(id);
const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const t = () => TEXT[state.lang];
const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

function uuid() {
  if (crypto.randomUUID) return crypto.randomUUID();
  // Fallback for older browsers.
  return "10000000-1000-4000-8000-100000000000".replace(/[018]/g, (c) =>
    (c ^ (crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (c / 4)))).toString(16));
}

// 42317 ms -> "0:42.3"
function formatTime(ms) {
  const tenths = Math.floor(ms / 100);
  const m = Math.floor(tenths / 600);
  const s = Math.floor(tenths / 10) % 60;
  return m + ":" + String(s).padStart(2, "0") + "." + (tenths % 10);
}

// ---- Mixed puzzles (topic "mixed") ----------------------------------------
// Five task types in the style of Danish worksheets for ages 8–12. A mixed round
// has two of each, in random order. Mirrored in simulator/questions.py.
// operand_a and operand_b keep a fixed meaning per type (see
// supabase/migrations/0002_mixed_topic.sql), and question_text is a short
// language-neutral ASCII form of the task for the pipeline.
// view() builds what the player sees: extra prompt lines or a fruit grid,
// the text before the answer box, and a unit after it.
const TASK_TYPES = ["sequence", "unit", "symbol", "price", "array"];
const FRUIT = [["banana", "🍌"], ["strawberry", "🍓"], ["apple", "🍎"], ["melon", "🍉"], ["lolly", "🍭"]];
const pick = (list) => list[rand(0, list.length - 1)];

function shuffle(list) {
  for (let i = list.length - 1; i > 0; i--) {
    const j = rand(0, i);
    [list[i], list[j]] = [list[j], list[i]];
  }
  return list;
}

// Amounts are kept in tenths, so 1,5 hours is 15 and no floating point is needed.
const whole = (lo, hi, unit = 1) => () => rand(lo, hi) * unit * 10;
const halves = (lo, hi) => () => rand(lo, hi) * 10 + 5;
// [from unit, to unit, factor, multiply (true) or divide (false), amount in tenths]
const UNITS = {
  1: [["m", "cm", 100, true, whole(1, 9)], ["km", "m", 1000, true, whole(1, 9)], ["h", "min", 60, true, whole(1, 5)]],
  2: [["kg", "g", 1000, true, whole(1, 9)], ["min", "s", 60, true, whole(1, 10)], ["cm", "m", 100, false, whole(1, 9, 100)],
      ["day", "h", 24, true, whole(1, 7)], ["m", "km", 1000, false, whole(1, 9, 1000)]],
  3: [["h", "min", 60, true, halves(1, 4)], ["km", "m", 1000, true, halves(0, 9)], ["kg", "g", 1000, true, halves(0, 9)],
      ["m", "cm", 100, true, halves(0, 9)], ["min", "s", 60, true, halves(1, 9)]]
};

function unitLabel(unit, tenths) {
  const label = t().units[unit];
  return Array.isArray(label) ? label[tenths === 10 ? 0 : 1] : label;
}

const decimal = (tenths) => String(tenths / 10).replace(".", t().decimal);

const MIXED = {
  // 4, 8, 12, 16, ?   operand_a = last shown number, operand_b = step
  sequence(level) {
    let step, start, up = true;
    if (level === 1) {
      step = pick([2, 5, 10]);
      start = step * rand(0, 5);
    } else if (level === 2) {
      step = rand(3, 9);
      up = Math.random() < 0.5;
      start = up ? rand(1, 60) : rand(4 * step, 4 * step + 60);
    } else {
      step = Math.random() < 0.5 ? rand(11, 25) : pick([25, 50, 100]);
      up = Math.random() < 0.5;
      start = up ? rand(100, 500) : rand(4 * step + 50, 4 * step + 500);
    }
    const d = up ? step : -step;
    const terms = [0, 1, 2, 3].map((i) => start + i * d);
    return {
      a: terms[3], b: step, answer: terms[3] + d, text: terms.join(", ") + ", ?",
      view: () => ({ hint: t().next, ask: terms.join(", ") + ",", small: true })
    };
  },
  // 1,5 hours = ? min   operand_a = conversion factor, operand_b = 0
  unit(level) {
    const [from, to, factor, multiply, amount] = pick(UNITS[level]);
    const tenths = amount();
    const answer = multiply ? tenths * factor / 10 : tenths / 10 / factor;
    return {
      a: factor, b: 0, answer, text: `${tenths / 10} ${from} = ? ${to}`,
      view: () => ({ ask: `${decimal(tenths)} ${unitLabel(from, tenths)} =`, suffix: unitLabel(to, answer * 10) })
    };
  },
  // ⭐ + ⭐ = 12, ⭐ + 💎 = 13, 💎 = ?   operand_a = last sum, operand_b = value of ⭐ (0 in one step)
  symbol(level) {
    const A = "⭐", B = "💎";
    if (level === 1) {
      const x = rand(2, 10);
      return { a: 2 * x, b: 0, answer: x, text: `A+A=${2 * x}; A=?`,
        view: () => ({ lines: [`${A} + ${A} = ${2 * x}`], ask: `${A} =` }) };
    }
    const x = level === 2 ? rand(2, 10) : rand(4, 15);
    const y = level === 2 ? rand(2, 12) : rand(5, 25);
    const n = level === 2 ? 2 : 3;
    return {
      a: x + y, b: x, answer: y, text: `${Array(n).fill("A").join("+")}=${n * x}; A+B=${x + y}; B=?`,
      view: () => ({ lines: [`${Array(n).fill(A).join(" + ")} = ${n * x}`, `${A} + ${B} = ${x + y}`], ask: `${B} =` })
    };
  },
  // 🍌🍌🍌🍌 = 20, 🍓🍓🍌 = 11, 🍓 = ?   operand_a = basket total, operand_b = how many of the asked fruit
  price(level) {
    const [[xName, x], [yName, y]] = shuffle(FRUIT.slice());
    if (level === 1) {
      const p = rand(2, 10), n = rand(2, 5);
      return { a: n * p, b: n, answer: p, text: `${n} ${xName}=${n * p}; ${xName}=?`,
        view: () => ({ lines: [`${x.repeat(n)} = ${n * p} ${t().money}`], ask: `${x} =`, suffix: t().money }) };
    }
    const p = level === 2 ? rand(2, 10) : rand(5, 20);
    const q = level === 2 ? rand(2, 10) : rand(5, 25);
    const n = rand(2, 4);
    const k = level === 2 ? rand(1, 3) : rand(2, 3);
    const m = level === 2 ? 1 : 2;
    const total = k * q + m * p;
    return {
      a: total, b: k, answer: q, text: `${n} ${xName}=${n * p}; ${k} ${yName}+${m} ${xName}=${total}; ${yName}=?`,
      view: () => ({ lines: [`${x.repeat(n)} = ${n * p} ${t().money}`, `${y.repeat(k)}${x.repeat(m)} = ${total} ${t().money}`], ask: `${y} =`, suffix: t().money })
    };
  },
  // A grid of fruit: rows × columns.   operand_a = rows, operand_b = columns
  array(level) {
    const [r0, r1, c0, c1] = { 1: [2, 5, 2, 5], 2: [3, 5, 4, 8], 3: [4, 6, 6, 10] }[level];
    const rows = rand(r0, r1), cols = rand(c0, c1), fruit = pick(FRUIT)[1];
    return { a: rows, b: cols, answer: rows * cols, text: `${rows}x${cols} grid`,
      view: () => ({ grid: { rows, cols, fruit }, ask: `${fruit} ${t().inTotal} =` }) };
  }
};

// ---- Question generation ------------------------------------------------
// The 10 obstacles of a round.
// Matematik: two each of +, −, ×, ÷ and two mixed puzzles of different task types.
// Dansk: 10 different words of the chosen level.
function planRound(subject, level) {
  if (subject === "danish") {
    return shuffle(WORDS[level].slice()).slice(0, QUESTIONS_PER_ROUND)
      .map(([word, ...wrong]) => ({ topic: "danish", word, options: shuffle([word, ...wrong]) }));
  }
  const puzzles = shuffle(TASK_TYPES.slice()).slice(0, 2);
  return shuffle([
    ...["addition", "subtraction", "multiplication", "division"].flatMap((topic) => [{ topic }, { topic }]),
    ...puzzles.map((type) => ({ topic: "mixed", type }))
  ]);
}

// Returns { topic, a, b, answer }, plus { type, text, view } for mixed puzzles
// and { word, options } for spelling. Math values are whole numbers >= 0.
function makeQuestion(plan, level) {
  if (plan.topic === "danish") return { topic: "danish", word: plan.word, options: plan.options, answer: plan.word };
  return Object.assign({ topic: plan.topic }, mathQuestion(plan.topic, level, plan.type));
}

function mathQuestion(topic, level, type) {
  if (topic === "mixed") return Object.assign({ type }, MIXED[type](level));
  if (topic === "addition") {
    const max = RANGE[level];
    const a = rand(Math.floor(max / 10), max - 1);
    const b = rand(1, max - a);
    return { a, b, answer: a + b };
  }
  if (topic === "subtraction") {
    const max = RANGE[level];
    const a = rand(Math.floor(max / 10), max);
    const b = rand(1, a);
    return { a, b, answer: a - b };
  }
  if (topic === "multiplication") {
    const [fa, fb] = FACTORS[level];
    const a = rand(fa[0], fa[1]);
    const b = rand(fb[0], fb[1]);
    return Math.random() < 0.5 ? { a, b, answer: a * b } : { a: b, b: a, answer: a * b };
  }
  // division: built backwards from divisor × quotient, so the answer is whole
  const [fd, fq] = DIVISION[level];
  const divisor = rand(fd[0], fd[1]);
  const quotient = rand(fq[0], fq[1]);
  return { a: divisor * quotient, b: divisor, answer: quotient };
}

// ---- Event tracking -----------------------------------------------------
// One event per answer or skip. Sending never blocks the game.
// Dansk is stored as topic "spelling" (supabase/migrations/0003_spelling_topic.sql):
// word = the correct spelling, given_answer = the spelling picked,
// operand_a = letters in the word, operand_b and correct_answer = 0.
function track(givenAnswer, responseMs) {
  const q = state.current;
  const spelling = q.topic === "danish";
  const event = {
    session_id: state.sessionId,
    language: state.lang,
    topic: spelling ? "spelling" : q.topic,
    level: state.level,
    question_index: state.index,
    operand_a: spelling ? [...q.word].length : q.a,
    operand_b: spelling ? 0 : q.b,
    correct_answer: spelling ? 0 : q.answer,
    given_answer: givenAnswer,
    response_ms: Math.min(Math.round(responseMs), 600000),
    client_ts: new Date().toISOString()
  };
  if (q.type) {
    event.task_type = q.type;
    event.question_text = q.text;
  }
  if (spelling) event.word = q.word;
  state.log.push(event);
  renderLog();
  send(event, 2);
}

async function post(event) {
  const res = await fetch(SUPABASE_URL + "/rest/v1/answer_events", {
    method: "POST",
    keepalive: true,
    headers: {
      "apikey": SUPABASE_KEY,
      "Content-Type": "application/json",
      "Content-Profile": "bronze",   // target the bronze schema
      "Prefer": "return=minimal"     // anon has no select right
    },
    body: JSON.stringify(event)
  });
  if (!res.ok) {
    const err = new Error("HTTP " + res.status);
    err.status = res.status;
    throw err;
  }
}

async function send(event, retriesLeft) {
  try {
    await post(event);
    state.sent++;
  } catch (err) {
    // 4xx means the database rejected the row: retrying won't help.
    if (err.status && err.status < 500) {
      console.warn("Event rejected:", err);
    } else if (retriesLeft > 0) {
      setTimeout(() => send(event, retriesLeft - 1), 1500);
      return;
    } else {
      // Offline or server down: keep it and send it later (also when installed and offline).
      writeQueue([...readQueue(), event]);
      state.failed = readQueue().length;
    }
  }
  renderStatus();
}

// ---- Offline queue --------------------------------------------------------
// Answers given offline are kept in localStorage and sent when the device is
// online again. A resend can create a duplicate if the first request actually
// arrived; silver deduplicates per session and question, so that is safe.
const QUEUE_KEY = "mathTrailQueue";

function readQueue() {
  try { return JSON.parse(localStorage.getItem(QUEUE_KEY)) || []; } catch (e) { return []; }
}

function writeQueue(queue) {
  try { localStorage.setItem(QUEUE_KEY, JSON.stringify(queue.slice(-500))); } catch (e) { /* storage blocked */ }
}

let flushing = false;
async function flushQueue() {
  if (flushing || !navigator.onLine) return;
  const queue = readQueue();
  if (!queue.length) return;
  flushing = true;
  writeQueue([]);
  const left = [];
  for (const event of queue) {
    try {
      await post(event);
      state.sent++;
    } catch (err) {
      if (!(err.status && err.status < 500)) left.push(event);
    }
  }
  writeQueue([...left, ...readQueue()]);
  state.failed = readQueue().length;
  flushing = false;
  renderStatus();
}

// ---- Best times -----------------------------------------------------------
// Kept on this device only, per subject and level. Never sent anywhere.
const BEST_KEY = "mathTrailBest";
const bestKey = () => state.subject + "-" + state.level;

function readBest() {
  try { return JSON.parse(localStorage.getItem(BEST_KEY)) || {}; } catch (e) { return {}; }
}

function saveBest(ms) {
  const best = readBest();
  const old = best[bestKey()];
  if (old !== undefined && old <= ms) return false;
  best[bestKey()] = ms;
  try { localStorage.setItem(BEST_KEY, JSON.stringify(best)); } catch (e) { /* storage blocked */ }
  return true;
}

// ---- The course -----------------------------------------------------------
// World coordinates in px. Obstacle i (1..10) stands at i * GAP.
// The camera keeps the runner at RUNNER_SCREEN_X from the left edge of the scene.
const GAP = 240;
const RUNNER_SCREEN_X = 90;
const START_X = 60;
const FINISH_X = QUESTIONS_PER_ROUND * GAP + 200;
const COURSE_WIDTH = FINISH_X + 400;
const MOTION = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 0.4 : 1;
const obstacleX = (i) => i * GAP;
const waitingX = (i) => obstacleX(i) - 70;   // where the runner stops to answer
const landedX = (i) => obstacleX(i) + 80;    // where the runner lands after the jump

const INK = 'stroke="#23272f" stroke-width="2.5" stroke-linejoin="round"';
const OBSTACLES = [
  // hurdle
  { w: 64, h: 46, svg: `<rect x="5" y="10" width="7" height="35" fill="#fff" ${INK}/><rect x="52" y="10" width="7" height="35" fill="#fff" ${INK}/>
    <rect x="2" y="8" width="60" height="11" fill="#e23b3b" ${INK}/><rect x="14" y="9.5" width="9" height="8" fill="#fff"/><rect x="34" y="9.5" width="9" height="8" fill="#fff"/>` },
  // traffic cones
  { w: 72, h: 40, svg: [4, 26, 48].map((x) => `<path d="M${x} 38 L${x + 10} 4 L${x + 10} 4 L${x + 20} 38 Z" fill="#ff8a1f" ${INK}/><rect x="${x + 5}" y="18" width="10" height="6" fill="#fff"/><rect x="${x - 2}" y="35" width="24" height="4" fill="#ff8a1f" ${INK}/>`).join("") },
  // tyre stack
  { w: 52, h: 50, svg: [33, 19, 5].map((y) => `<rect x="3" y="${y}" width="46" height="13" rx="6" fill="#3a3f48" ${INK}/><rect x="15" y="${y + 4}" width="22" height="5" rx="2" fill="#7a818c"/>`).join("") },
  // crates
  { w: 62, h: 54, svg: `<rect x="2" y="24" width="30" height="29" fill="#c98a45" ${INK}/><path d="M2 24 L32 53 M32 24 L2 53" ${INK}/>
    <rect x="30" y="24" width="30" height="29" fill="#d99a55" ${INK}/><path d="M30 24 L60 53 M60 24 L30 53" ${INK}/>
    <rect x="16" y="2" width="30" height="23" fill="#e0a865" ${INK}/><path d="M16 2 L46 25 M46 2 L16 25" ${INK}/>` },
  // road barrier
  { w: 74, h: 42, svg: `<rect x="8" y="16" width="6" height="26" fill="#9aa3ae" ${INK}/><rect x="60" y="16" width="6" height="26" fill="#9aa3ae" ${INK}/>
    <rect x="2" y="6" width="70" height="14" fill="#fff" ${INK}/><path d="M10 7 L20 19 M26 7 L36 19 M42 7 L52 19 M58 7 L68 19" stroke="#e23b3b" stroke-width="6"/>
    <rect x="2" y="6" width="70" height="14" fill="none" ${INK}/><circle cx="37" cy="3" r="3" fill="#ffd84d" ${INK}/>` },
  // hay bales
  { w: 66, h: 44, svg: `<rect x="2" y="20" width="62" height="23" rx="4" fill="#f2c94c" ${INK}/><path d="M10 26 H56 M10 32 H56 M10 38 H56" stroke="#c99a1d" stroke-width="2"/>
    <rect x="12" y="2" width="42" height="19" rx="4" fill="#f5d36b" ${INK}/><path d="M18 8 H48 M18 14 H48" stroke="#c99a1d" stroke-width="2"/>` }
];

function svg(w, h, body) {
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${body}</svg>`;
}

function flagSvg(label, colour) {
  // two poles with a chequered banner
  let squares = "";
  for (let i = 0; i < 9; i++) squares += `<rect x="${6 + i * 10}" y="${i % 2 ? 6 : 16}" width="10" height="10" fill="#23272f"/>`;
  return svg(108, 118, `<rect x="2" y="4" width="6" height="113" fill="#fff" ${INK}/><rect x="100" y="4" width="6" height="113" fill="#fff" ${INK}/>
    <rect x="6" y="6" width="96" height="20" fill="#fff"/>${squares}<rect x="6" y="6" width="96" height="20" fill="none" ${INK}/>
    <rect x="18" y="30" width="72" height="20" rx="4" fill="${colour}" ${INK}/><text class="flag-text" x="54" y="45" text-anchor="middle">${label}</text>`);
}

// Background town: blocky houses and trees, drawn once. It moves at half speed (parallax).
function buildTown() {
  const colours = ["#ff9aa2", "#a0d8ff", "#ffe08a", "#b5e8a3", "#d7b8ff", "#ffffff", "#ffc48a"];
  const roofs = ["#c0392b", "#2f6fdf", "#6b3f1f", "#3a3f48", "#8e44ad"];
  const width = Math.ceil(COURSE_WIDTH / 2 + 600);
  let body = "";
  let x = -20;
  let n = 0;
  while (x < width) {
    const w = 96 + (n * 37) % 40;
    const h = 52 + (n * 23) % 34;
    const base = 120;
    const wall = colours[n % colours.length];
    const roof = roofs[(n * 3) % roofs.length];
    body += `<rect x="${x}" y="${base - h}" width="${w}" height="${h}" fill="${wall}" ${INK}/>`;
    body += `<path d="M${x - 6} ${base - h} L${x + w / 2} ${base - h - 26} L${x + w + 6} ${base - h} Z" fill="${roof}" ${INK}/>`;
    body += `<rect x="${x + w / 2 - 9}" y="${base - 26}" width="18" height="26" fill="#8b5a2b" ${INK}/>`;
    body += `<rect x="${x + 12}" y="${base - h + 12}" width="18" height="16" fill="#cfefff" ${INK}/>`;
    body += `<rect x="${x + w - 30}" y="${base - h + 12}" width="18" height="16" fill="#cfefff" ${INK}/>`;
    x += w + 18;
    if (n % 2 === 0) {   // a blocky tree between some houses
      body += `<rect x="${x - 4}" y="${base - 22}" width="8" height="22" fill="#8b5a2b" ${INK}/>`;
      body += `<rect x="${x - 17}" y="${base - 52}" width="34" height="32" rx="6" fill="#4caf50" ${INK}/>`;
      x += 30;
    }
    n++;
  }
  $("town").style.width = width + "px";
  $("town").innerHTML = svg(width, 122, body);
}

function buildCourse() {
  $("world").style.width = COURSE_WIDTH + "px";
  let html = `<div class="marker" style="left:${START_X - 70}px">${flagSvg("START", "#a0d8ff")}</div>`;
  for (let i = 1; i <= QUESTIONS_PER_ROUND; i++) {
    const o = OBSTACLES[(i - 1) % OBSTACLES.length];
    html += `<div class="obstacle" id="obstacle${i}" style="left:${obstacleX(i) - o.w / 2}px">${svg(o.w, o.h, o.svg)}</div>`;
  }
  html += `<div class="marker" style="left:${FINISH_X - 54}px">${flagSvg(t().finish, "#ffd84d")}</div>`;
  $("course").innerHTML = html;
}

// Moves the runner to world position x, and the camera with it.
function moveTo(x, ms) {
  const cam = Math.max(0, x - RUNNER_SCREEN_X);
  [$("world"), $("town"), $("avatar")].forEach((el) => { el.style.transitionDuration = ms + "ms"; });
  $("avatar").style.transform = "translateX(" + x + "px)";
  $("world").style.transform = "translateX(" + (-cam) + "px)";
  $("town").style.transform = "translateX(" + (-cam * 0.5) + "px)";
  state.x = x;
  return wait(ms);
}

function animate(cls, on) {
  const s = $("sprite");
  if (on) { s.classList.remove(cls); void s.offsetWidth; s.classList.add(cls); } else { s.classList.remove(cls); }
}

async function runTo(x, ms) {
  animate("running", true);
  await moveTo(x, Math.round(ms * MOTION));
  animate("running", false);
}

async function jumpTo(x, ms) {
  const d = Math.round(ms * MOTION);
  $("sprite").style.setProperty("--jump-ms", d + "ms");
  animate("jump", true);
  await runTo(x, ms);
  animate("jump", false);
}

function banner(text) {
  const b = $("banner");
  b.textContent = text;
  b.classList.remove("show");
  if (text) { void b.offsetWidth; b.classList.add("show"); }
}

// ---- Rendering ----------------------------------------------------------
function applyText() {
  document.documentElement.lang = state.lang;
  document.title = t().title;
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t()[el.dataset.t]; });
  $("quitBtn").setAttribute("aria-label", t().quit);
  $("skipBtn").setAttribute("aria-label", t().skip);
  $("muteBtn").setAttribute("aria-label", t().sound);
  renderChoices();
  renderStatus();
  if (state.current) renderMeta();
}

function renderChoices() {
  $("topics").innerHTML = "";
  SUBJECTS.forEach((subject) => {
    const b = document.createElement("button");
    b.className = "choice";
    b.textContent = SUBJECT_ICON[subject] + " " + t().subjects[subject];
    b.setAttribute("aria-pressed", String(subject === state.subject));
    b.onclick = () => { state.subject = subject; renderChoices(); };
    $("topics").appendChild(b);
  });
  $("levels").innerHTML = "";
  [1, 2, 3].forEach((level) => {
    const b = document.createElement("button");
    b.className = "choice";
    b.textContent = t().levels[level];
    b.setAttribute("aria-pressed", String(level === state.level));
    b.onclick = () => { state.level = level; renderChoices(); };
    $("levels").appendChild(b);
  });
  const best = readBest()[bestKey()];
  $("bestStart").textContent = best === undefined ? t().noBest : t().best + ": " + formatTime(best);
}

function renderMeta() {
  $("qCounter").textContent = "🚧 " + Math.max(state.index, 1) + "/" + QUESTIONS_PER_ROUND;
}

function currentTotal() {
  const thinking = state.shownAt ? performance.now() - state.shownAt : 0;
  return state.runMs + thinking + state.penalties * PENALTY_MS;
}

function renderClock() {
  $("clock").firstChild.nodeValue = "⏱ " + formatTime(currentTotal());
}

function clockLoop() {
  if ($("play").classList.contains("hidden")) return;
  renderClock();
  requestAnimationFrame(clockLoop);
}

function popPenalty() {
  const p = document.createElement("span");
  p.className = "penalty-pop";
  p.textContent = "+10 s";
  $("clock").appendChild(p);
  setTimeout(() => p.remove(), 1300);
}

function renderQuestion(q) {
  const prompt = $("prompt");
  prompt.textContent = "";
  if (q.topic === "danish") {
    // Three spellings as buttons in the keypad; the player taps the right one.
    $("question").textContent = t().spellAsk;
    $("question").className = "small";
    $("suffix").textContent = "";
    $("answerBox").classList.add("hidden");
    prompt.classList.add("hidden");
    $("keypad").innerHTML = q.options.map((w, n) =>
      `<button class="key" data-key="pick" data-word="${w}" aria-keyshortcuts="${n + 1}">${w}</button>`).join("");
    return;
  }
  $("question").className = "";
  $("answerBox").classList.remove("hidden");
  if (!q.type) {
    $("question").textContent = q.a + " " + SYMBOL[q.topic] + " " + q.b + " =";
    $("question").classList.remove("small");
    $("suffix").textContent = "";
    prompt.classList.add("hidden");
    return;
  }
  const v = q.view();
  if (v.hint) {
    const d = document.createElement("div");
    d.className = "hint";
    d.textContent = v.hint;
    prompt.appendChild(d);
  }
  (v.lines || []).forEach((line) => {
    const d = document.createElement("div");
    d.textContent = line;
    prompt.appendChild(d);
  });
  if (v.grid) {
    const g = document.createElement("div");
    g.className = "fruit-grid";
    g.style.gridTemplateColumns = "repeat(" + v.grid.cols + ", 1fr)";
    g.setAttribute("role", "img");
    g.setAttribute("aria-label", v.grid.rows + " × " + v.grid.cols);
    for (let i = 0; i < v.grid.rows * v.grid.cols; i++) {
      const cell = document.createElement("span");
      cell.textContent = v.grid.fruit;
      g.appendChild(cell);
    }
    prompt.appendChild(g);
  }
  prompt.classList.toggle("hidden", !prompt.childElementCount);
  $("question").textContent = v.ask;
  $("question").classList.toggle("small", !!v.small);
  $("suffix").textContent = v.suffix || "";
}

function setTyped(value) {
  state.typed = value.slice(0, 16);
  $("answerBox").textContent = state.typed || "?";
  $("answerBox").classList.toggle("empty", !state.typed);
  if ($("submitBtn")) $("submitBtn").disabled = state.locked || state.typed === "";
}

function setLocked(locked) {
  state.locked = locked;
  document.querySelectorAll("#keypad .key").forEach((k) => { k.disabled = locked; });
  $("skipBtn").disabled = locked;
  setTyped(state.typed);
}

function renderStatus() {
  $("sendStatus").textContent = state.sent + " " + t().sent + (state.failed ? ", " + state.failed + " " + t().failed : "");
}

function renderLog() {
  $("eventLog").textContent = JSON.stringify(state.log.slice(-5).reverse(), null, 2);
}

function show(id) {
  ["start", "play", "end"].forEach((s) => $(s).classList.toggle("hidden", s !== id));
  // During a run, only the course is on screen.
  $("topbar").classList.toggle("hidden", id === "play");
  $("behindCard").classList.toggle("hidden", id === "play");
}

// ---- Game flow ----------------------------------------------------------
// state.run identifies the current round. Stopping or restarting bumps it,
// so the animations of an old round stop at their next step.
async function startRound() {
  const run = ++state.run;
  Sound.startMusic();
  Object.assign(state, { sessionId: uuid(), index: 0, score: 0, runMs: 0, penalties: 0, shownAt: 0, current: null });
  state.queue = planRound(state.subject, state.level);
  buildKeypad(state.subject);
  $("prompt").classList.add("hidden");
  $("suffix").textContent = "";
  buildCourse();
  $("question").textContent = "";
  $("feedback").textContent = "";
  setLocked(true);
  setTyped("");
  show("play");
  await moveTo(START_X, 0);
  renderMeta();
  clockLoop();
  for (const text of ["3", "2", "1", t().go]) {
    banner(text);
    await wait(650);
    if (run !== state.run) return;
  }
  banner("");
  await runTo(waitingX(1), 900);
  if (run !== state.run) return;
  nextQuestion();
}

function nextQuestion() {
  state.index++;
  state.current = makeQuestion(state.queue[state.index - 1], state.level);
  renderQuestion(state.current);
  $("feedback").textContent = "";
  $("feedback").className = "feedback";
  setTyped("");
  setLocked(false);
  renderMeta();
  state.shownAt = performance.now();
}

async function answer(raw) {
  if (state.locked || !state.current) return;
  setLocked(true);
  const run = state.run;
  const elapsed = performance.now() - state.shownAt;
  state.runMs += elapsed;
  state.shownAt = 0;
  const spelling = state.current.topic === "danish";
  const given = raw === null ? null : raw.trim().slice(0, spelling ? 16 : 10);
  track(given, elapsed);

  const i = state.index;
  const fb = $("feedback");
  const ok = given !== null && (spelling
    ? given === state.current.answer
    : /^\d+$/.test(given) && Number(given) === state.current.answer);
  if (spelling) {
    // Show the right spelling in green and a wrong pick in red.
    document.querySelectorAll("#keypad [data-word]").forEach((b) => {
      if (b.dataset.word === state.current.answer) b.classList.add("right");
      else if (b.dataset.word === given) b.classList.add("wrong");
    });
  }
  if (ok) {
    state.score++;
    Sound.correct();
    fb.textContent = t().correct;
    fb.className = "feedback good";
    await jumpTo(landedX(i), 650);
  } else {
    // Wrong or skipped: +10 seconds, the runner bumps into the obstacle, then climbs over.
    state.penalties++;
    Sound.wrong();
    fb.textContent = (given === null ? t().skipped : t().wrongWas) + " " + state.current.answer;
    fb.className = "feedback bad";
    popPenalty();
    await runTo(obstacleX(i) - 36, 250);
    if (run !== state.run) return;
    $("obstacle" + i).classList.remove("hit");
    void $("obstacle" + i).offsetWidth;
    $("obstacle" + i).classList.add("hit");
    animate("crash", true);
    await wait(Math.round(900 * MOTION));
    animate("crash", false);
    if (run !== state.run) return;
    await jumpTo(landedX(i), 650);
  }
  if (run !== state.run) return;
  if (i >= QUESTIONS_PER_ROUND) {
    await runTo(FINISH_X + 30, 1100);
    if (run !== state.run) return;
    Sound.stopMusic();
    Sound.goal();
    banner("🏁");
    await wait(700);
    if (run !== state.run) return;
    banner("");
    return endRound();
  }
  Sound.next();
  await runTo(waitingX(i + 1), 450);
  if (run !== state.run) return;
  nextQuestion();
}

function endRound() {
  state.current = null;
  const total = Math.round(state.runMs) + state.penalties * PENALTY_MS;
  $("finalTime").textContent = formatTime(total);
  $("breakdown").textContent = t().runTime + " " + formatTime(state.runMs) + " + " + state.penalties + " × 10 s · " +
    state.score + "/" + QUESTIONS_PER_ROUND + " " + t().correctOf;
  const isRecord = saveBest(total);
  $("record").textContent = isRecord ? t().newBest : t().best + ": " + formatTime(readBest()[bestKey()]);
  renderChoices();
  show("end");
}

function stopRound() {
  state.run++;
  state.current = null;
  state.shownAt = 0;
  Sound.stopMusic();
  banner("");
  show("start");
}

// ---- Keypad ---------------------------------------------------------------
function key(k, label, cls) {
  return `<button class="key${cls ? " " + cls : ""}" data-key="${k}"${k === "del" ? ` aria-label="${t().del}"` : ""}${k === "ok" ? ' id="submitBtn"' : ""}>${label}</button>`;
}

function buildKeypad(subject) {
  const pad = $("keypad");
  pad.classList.toggle("options", subject === "danish");
  if (subject === "danish") {
    pad.innerHTML = "";   // filled with three spellings per question by renderQuestion()
  } else {
    pad.innerHTML = [1, 2, 3, 4, 5, 6, 7, 8, 9].map((n) => key(n, n)).join("") +
      key("del", "⌫", "del") + key(0, 0) + key("ok", t().check, "ok");
  }
}

// ---- Reward: a dinosaur with a pizza and heart sunglasses -------------------
// Drawn in SVG in code, no image file. Shown on the end screen after every round.
function heart(cx, cy, s) {
  return `M${cx} ${cy + s * 0.9} C${cx - s * 1.5} ${cy + s * 0.05} ${cx - s * 0.9} ${cy - s * 1.05} ${cx} ${cy - s * 0.35}
    C${cx + s * 0.9} ${cy - s * 1.05} ${cx + s * 1.5} ${cy + s * 0.05} ${cx} ${cy + s * 0.9} Z`;
}

    <rect x="96" y="160" width="20" height="36" rx="6" fill="${dark}" ${INK}/>

  const glasses = `
    <path d="M100 58 L114 62" ${INK} fill="none"/>

  const pizza = `
    <path d="M150 126 L192 94 L200 128 Z" fill="#ffd84d" ${INK}/>
    <path d="M192 94 L200 128" stroke="#d9922e" stroke-width="9" stroke-linecap="round"/>
    <path d="M192 94 L200 128" fill="none" ${INK}/>

    <circle cx="187" cy="120" r="4.5" fill="#e23b3b" ${INK}/>
    <circle cx="166" cy="120" r="3.5" fill="#e23b3b" ${INK}/>
    <path d="M158 124 q-2 6 1 10" stroke="#ffd84d" stroke-width="3" fill="none" stroke-linecap="round"/>`;

  return `<svg class="dino" viewBox="0 0 210 216" role="img" aria-label="🦖🍕😎" xmlns="http://www.w3.org/2000/svg">
    <g class="bob">${body}${glasses}${pizza}${arm}</g></svg>`;

// ---- Wiring -------------------------------------------------------------
$("keypad").addEventListener("click", (e) => {
  const key = e.target.closest("[data-key]");
  if (!key || state.locked) return;
  const k = key.dataset.key;
  if (k === "pick") answer(key.dataset.word);
  else if (k === "del") setTyped(state.typed.slice(0, -1));
  else if (k === "ok") { if (state.typed) answer(state.typed); }
  else setTyped(state.typed + k);
});
// A physical keyboard works too (tablet with keyboard, computer).
document.addEventListener("keydown", (e) => {
  if ($("play").classList.contains("hidden") || state.locked || e.ctrlKey || e.metaKey || e.altKey) return;
  const spelling = state.current && state.current.topic === "danish";
  if (spelling && /^[1-3]$/.test(e.key)) answer(state.current.options[Number(e.key) - 1]);
  else if (spelling) return;
  else if (/^[0-9]$/.test(e.key)) setTyped(state.typed + e.key);
  else if (e.key === "Backspace") setTyped(state.typed.slice(0, -1));
  else if (e.key === "Enter" && state.typed) answer(state.typed);
  else return;
  e.preventDefault();
});
$("skipBtn").onclick = () => answer(null);
function renderMute() { $("muteBtn").textContent = Sound.isMuted() ? "🔇" : "🔊"; }
$("muteBtn").onclick = () => { Sound.setMuted(!Sound.isMuted()); renderMute(); };
renderMute();
// Stopping sends nothing: the last question_index in a session shows where the player gave up.
$("quitBtn").onclick = stopRound;
$("againBtn").onclick = startRound;
$("menuBtn").onclick = () => show("start");
$("startBtn").onclick = startRound;

state.failed = readQueue().length;
$("dino").innerHTML = dinoSvg();
buildKeypad(state.subject);
buildTown();
applyText();

// ---- Installable app ------------------------------------------------------
// The service worker only works over http(s), not when index.html is opened from disk.
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch((err) => console.warn("Service worker not registered:", err));
}

const isStandalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
let installPrompt = null;

// Chrome, Edge and Android: show our own install button.
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  installPrompt = e;
  $("installBtn").classList.remove("hidden");
});
$("installBtn").onclick = async () => {
  if (!installPrompt) return;
  installPrompt.prompt();
  await installPrompt.userChoice;
  installPrompt = null;
  $("installBtn").classList.add("hidden");
};
window.addEventListener("appinstalled", () => $("installBtn").classList.add("hidden"));

// iPhone and iPad have no install prompt: show how to do it by hand.
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
if (isIOS && !isStandalone) $("iosHint").classList.remove("hidden");

flushQueue();
window.addEventListener("online", flushQueue);
</script>
