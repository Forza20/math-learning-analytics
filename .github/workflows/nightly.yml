name: nightly

# Simulates yesterday's players, builds and tests every dbt model, then
# publishes the game, the dashboard and dbt docs to GitHub Pages.
# Runs every night, and can also be started by hand.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"  # 03:00 UTC, 04:00/05:00 in Copenhagen

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      DBT_HOST: ${{ secrets.DBT_HOST }}
      DBT_USER: ${{ secrets.DBT_USER }}
      DBT_PASSWORD: ${{ secrets.DBT_PASSWORD }}
      DBT_PORT: "5432"
      DBT_DBNAME: postgres
      DBT_PROFILES_DIR: dbt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Check connection
        run: dbt debug --project-dir dbt
      - name: Simulate yesterday's players
        run: python simulator/simulate.py
      - name: Build and test models
        run: dbt build --project-dir dbt
      - name: Generate dbt docs
        run: dbt docs generate --project-dir dbt --static
      - name: Export dashboard data
        run: python dashboard/export.py

      - name: Assemble site
        run: |
          mkdir -p _site/dashboard _site/dbt-docs _site/icons
          cp game/index.html game/sound.js game/manifest.webmanifest game/sw.js _site/
          cp game/icons/*.png _site/icons/
          cp dashboard/index.html dashboard/data.js _site/dashboard/
          cp dbt/target/static_index.html _site/dbt-docs/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: pipeline
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
