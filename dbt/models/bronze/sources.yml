version: 2

sources:
  - name: bronze
    description: Raw answer events written by the game and the simulator.
    schema: bronze
    loaded_at_field: received_at
    freshness:
      warn_after: {count: 26, period: hour}
      error_after: {count: 50, period: hour}
    tables:
      - name: answer_events
        description: One row per answer. given_answer is NULL when the player skipped.
        columns:
          - name: event_id
            data_tests: [not_null, unique]
          - name: session_id
            data_tests: [not_null]
          - name: source
            data_tests:
              - accepted_values:
                  arguments:
                    values: ['real', 'simulated']
