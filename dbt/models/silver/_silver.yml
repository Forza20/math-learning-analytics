version: 2

models:
  - name: answers
    description: >
      One row per answered or skipped question. Deduplicated per session and
      question, typed, and classified by outcome and error type.
    columns:
      - name: event_id
        data_tests: [not_null, unique]
      - name: session_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('sessions')
                field: session_id
      - name: source
        data_tests:
          - accepted_values:
              arguments:
                values: ['real', 'simulated']
      - name: topic
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['addition', 'subtraction', 'multiplication', 'division', 'mixed']
      - name: task_type
        description: >
          Kind of mixed puzzle. Set for topic 'mixed' only. The meaning of operand_a
          and operand_b per task type is in supabase/migrations/0002_mixed_topic.sql.
        data_tests:
          - accepted_values:
              arguments:
                values: ['sequence', 'unit', 'symbol', 'price', 'array']
      - name: question_text
        description: Language-neutral ASCII form of a mixed puzzle, for example "A+A=12; A=?".
      - name: rules_version
        description: 1 for events played under the old ages 6-10 levels, 2 from var rules_v2_from.
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2]
                quote: false
      - name: given_answer_raw
        description: Typed input as received. NULL means skipped.
      - name: given_answer
        description: given_answer_raw as a number.
      - name: outcome
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['correct', 'wrong', 'skipped']
      - name: error_type
        description: >
          Set only when outcome is wrong. First matching rule wins: off_by_one,
          carry_borrow, reversed_digits, wrong_operation, table_neighbor,
          unit_slip, implausible, other.
        data_tests:
          - accepted_values:
              arguments:
                values: ['off_by_one', 'carry_borrow', 'reversed_digits', 'wrong_operation', 'table_neighbor', 'unit_slip', 'implausible', 'other']
      - name: is_too_fast
        description: Non-skip answered in under 250 ms. Likely not a human.
      - name: is_clock_skewed
        description: Real event whose device clock is more than an hour off the server.

  - name: sessions
    description: One row per round. A round has up to var questions_per_round questions.
    columns:
      - name: session_id
        data_tests: [not_null, unique]
      - name: answers
        data_tests: [not_null]
      - name: quit_after_question
        description: Last question answered before the player stopped. NULL when the round was completed.

